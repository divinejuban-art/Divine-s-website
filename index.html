    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script>


        /* =====================================
           ORIGINAL OPEN MY PAGE FUNCTION
           ===================================== */

        const openButton =
            document.getElementById("openButton");

        const introCard =
            document.getElementById("introCard");


        openButton.addEventListener(
            "click",
            function() {

                if (
                    introCard.style.display === "none" ||
                    introCard.style.display === ""
                ) {

                    introCard.style.display = "block";

                    openButton.innerHTML =
                        "&#x1F4D5; Close My Page";

                }

                else {

                    introCard.style.display = "none";

                    openButton.innerHTML =
                        "&#x1F4D6; Open My Page";

                }

            }
        );



        /* =====================================
           SHOW MY MEMORIES FUNCTION
           ===================================== */

        const photoButton =
            document.getElementById("photoButton");

        const photoWall =
            document.getElementById("photoWall");


        photoButton.addEventListener(
            "click",
            function() {

                /* SHOW PHOTO WALL */

                if (
                    photoWall.style.display === "none" ||
                    photoWall.style.display === ""
                ) {

                    photoWall.style.display = "grid";

                    photoButton.innerHTML =
                        "&#x1F4D5; Hide My Memories";

                }


                /* HIDE PHOTO WALL */

                else {

                    photoWall.style.display = "none";

                    photoButton.innerHTML =
                        "&#x1F4F8; Show My Memories";

                }

            }
        );


    </script>
